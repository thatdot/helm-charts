
admin:
  existingSecret: grafana-admin-credentials

datasources:
 datasources.yaml:
   apiVersion: 1
   datasources:
      # <string, required> name of the datasource. Required
    - name: Quine Enterprise Metrics (InfluxDB)
      # <string, required> datasource type. Required
      type: influxdb
      # <string> the published dashboard refers to its datasource by this uid
      uid: P951FEA4DE68E13C5
      # <string, required> access mode. proxy or direct (Server or Browser in the UI). Required
      access: proxy
      # <int> org id. will default to orgId 1 if not specified
      orgId: 1
      # <string> url
      url: http://influx-influxdb:8086
      # <string> database name, if used
      database: metrics
      # <bool> enable/disable with credentials headers
      withCredentials: false
      # <bool> mark as default datasource. Max one per org
      isDefault: true
      # <map> fields that will be converted to json and stored in json_data
      jsonData:
         httpMode: "GET"
      version: 1
      # <bool> allow users to edit datasources from the UI.
      editable: false

dashboardProviders:
   dashboardproviders.yaml:
     apiVersion: 1
     providers:
     - name: 'default'
       orgId: 1
       folder: ''
       type: file
       disableDeletion: false
       editable: true
       options:
         path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    quine-dashboard:
      # The current thatDot dashboard for InfluxDB, downloaded each time the Grafana pod starts
      url: https://thatdot-grafana-dashboards.s3.us-west-2.amazonaws.com/dashboards/quine/quine-influx.json
