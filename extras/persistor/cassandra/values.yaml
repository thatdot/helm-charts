# Default values for the example Cassandra persistor.

# Official Apache Cassandra image from Docker Hub.
image:
  repository: cassandra
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Number of Cassandra nodes
replicaCount: 1

clusterName: thatdot-persistor

# Datacenter and rack reported by every node. The datacenter must match
# `cassandra.localDatacenter` in the Quine Enterprise and Novelty charts.
datacenter: datacenter1
rack: rack1

# Require a username and password (Cassandra's PasswordAuthenticator).
# Cassandra then creates its default superuser: username `cassandra`,
# password `cassandra`. Change that password before storing real data.
auth:
  enabled: true

# JVM heap. Set these explicitly: Cassandra otherwise sizes its heap from the
# memory of the Kubernetes node rather than from the container's memory limit.
# Keep maxHeapSize at or below half of the memory limit.
maxHeapSize: 1G
heapNewSize: 256M

persistence:
  size: 10Gi
  # Uses the cluster's default storage class when empty
  storageClass: ""

resources: {}
  # requests:
  #   cpu: 1
  #   memory: 2Gi
  # limits:
  #   memory: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}
