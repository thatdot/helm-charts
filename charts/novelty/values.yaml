# Default values for novelty.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# License key secret required for Novelty
licenseKeySecret:
  name: ""
  key: "license-key"

# Cassandra Persistor Settings:
# Set enabled to true to store Novelty's data in a Cassandra cluster.
# If enabled is set to false, Novelty uses its default store: a RocksDB database
# on the pod's local filesystem, which is lost when the pod is replaced unless
# a volume is mounted for it.
cassandra:
  enabled: false

  plaintextAuth:
    # Enable to use basic auth with Cassandra
    enabled: false
    username: "cassandra"
    passwordExistingSecret: {}
      # # Set passwordExisting secret to use configuration from a kubernetes secret
      # # overrides cassandra.plaintextAuth.password
      # # Ex:
      # name: "my-secret"
      # key: "my-secret-key"
    password: "cassandra"

  # Comma-separated list of Cassandra endpoints
  # Required when enabled is true.
  endpoints: ""

  # Configure the default keyspace name
  keyspace: novelty

  # Set these two values to true for Novelty to create its own keyspace and tables
  # If false, keyspace and tables must be existing before this chart is installed.
  shouldCreateKeyspace: true
  shouldCreateTables: true

  # How many copies of each datum the Cassandra cluster should retain
  replicationFactor: 1

  # How many hosts must agree on a datum for Novelty to consider that
  # datum written/read
  readConsistency: LOCAL_QUORUM
  writeConsistency: LOCAL_QUORUM

  # Passed through to Cassandra
  localDatacenter: datacenter1

  # How long to wait before considering a write operation failed
  writeTimeout: 10s

  # How long to wait before considering a read operation failed
  readTimeout: 10s

# Metrics Configuration:
metrics:
  jmx:
    enabled: false
  influx:
    enabled: false
    period: 30s
    database: metrics
    scheme: http
    # Set "host" and "port" to the reachable address of the influx server
    host: ""
    port: 8086
  csv:
    enabled: false
    period: 200ms
    logDirectory: /metrics
  prometheus:
    # Set to true to expose JMX metrics over HTTP using the Prometheus JMX agent
    enabled: false
    # Port opened up on Quine Enterprise pod, exposing Prometheus Java Agent metrics
    port: 9090

# Java Management Extensions (JMX) and Remote Method Invocation (RMI) configuration
#
# These values configure JMX RMI. See the official docs in the following link
# https://docs.oracle.com/javase/6/docs/technotes/guides/management/agent.html
#
jmxRemote:
  enabled: false
  port: 9010
  rmiPort: 9010
  localOnly: false
  authenticate: false
  ssl: false
  rmiHostname: localhost

# Override image repository and tag to change the docker image used to run thatDot Novelty
image:
  repository: registry.license.thatdot.com/thatdot/novelty
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Pull secrets for the thatDot registry (e.g., [{"name": "thatdot-registry"}]).
# The registry username is your thatDot client id and the password is your
# license key. See the chart README for how to create the secret.
imagePullSecrets: []

service:
  name: novelty
  type: ClusterIP
  externalPort: 8080
  # Deprecated and ignored: the service targets webserver.port
  internalPort: 8080

resources:
  limits:
    cpu: 2048m
    memory: 4096Mi
  requests:
    cpu: 1024m
    memory: 2048Mi

# OIDC Configuration for OpenID Connect authentication
oidc:
  # Enable OpenID Connect authentication
  enabled: false
  provider:
    # OIDC provider base URL
    locationUrl: ""
    # OAuth2 authorization endpoint for login requests
    authorizationUrl: ""
    # OAuth2 token endpoint for exchanging auth codes
    tokenUrl: ""
    # OIDC provider's login endpoint path (appended to locationUrl for user redirect)
    loginPath: ""
    # (optional) Value the provider issues in the `aud` claim of access tokens
    # for this deployment. Required for bearer-token authentication: when
    # unset, bearer-token requests are rejected.
    accessTokenAudience: ""
    # (optional) Value sent as the OAuth2 `resource` parameter (RFC 8707) on
    # authorize redirects and token requests. Mostly needed by Microsoft ADFS
    # and Azure AD v1.0, where accessTokenAudience must be set to the same value.
    resourceUri: ""
  client:
    existingSecret:
      # Kubernetes secret containing OIDC client credentials
      name: ""
      secretKeys:
        # Secret key name containing the OIDC client ID
        clientIdKey: "client-id"
        # Secret key name containing the OIDC client secret
        clientSecretKey: "client-secret"
  session:
    # Auto-generate session encryption key if no existing secret provided.
    # The generated key is read back from the cluster on upgrade, so it only
    # stays stable when Helm installs the chart itself. Tools that render the
    # chart without cluster access (helm template, Argo CD) generate a new key
    # on every render: use existingSecret with those.
    autoGenerate: true
    existingSecret:
      # Kubernetes secret containing session encryption key (if not auto-generating)
      name: ""
      # Secret key name containing the session encryption key
      key: ""
    # Session timeout
    expirationSeconds: 3600
    # Use HTTPS-only secure cookies for session handling
    secureCookies: true

# Logging Configuration
thatdot:
  # Cluster-wide log level (ERROR, WARN, INFO, DEBUG)
  logLevel: WARN
  # Log level of the audit log (the "thatdot.Audit" logger). The audit log is
  # off unless this is set, e.g. to INFO.
  auditLogLevel: ""

webserver:
  enabled: true
  address: 0.0.0.0
  port: 8080
  useTls: false
  useMTls:
    enabled: false
    healthEndpoints:
      enabled: false
      port: 8081
    # trustStore:
    #   path: ""
    #   password: ""

webserverAdvertise:
  enabled: false
  address:
  port:

# mTLS Configuration
# When webserver.useMTls.enabled is true:
# - If healthEndpoints.enabled is true, health probes will use HTTP on the loopback
#   address with the configured healthEndpoints.port
# - If healthEndpoints.enabled is false, health probes will be disabled

# Whitespace-separated jdk arguments injected via JDK_JAVA_OPTIONS
extraJdkArgs: ""
