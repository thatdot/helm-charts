# Default values for novelty.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# License key secret required for Novelty
licenseKeySecret:
  name: ""
  key: "license-key"

# Metrics Configuration:
metrics:
  jmx:
    enabled: false
  influx:
    enabled: false
    period: 30s
    database: metrics
    scheme: http
    # Set "host" and "port" to the reachable address of the influx server
    host: ""
    port: 8086
  csv:
    enabled: false
    period: 200ms
    logDirectory: /metrics
  prometheus:
    # Set to true to expose JMX metrics over HTTP using the Prometheus JMX agent
    enabled: false
    # Port opened up on Quine Enterprise pod, exposing Prometheus Java Agent metrics
    port: 9090

# Java Management Extensions (JMX) and Remote Method Invocation (RMI) configuration
#
# These values configure JMX RMI. See the official docs in the following link
# https://docs.oracle.com/javase/6/docs/technotes/guides/management/agent.html
#
jmxRemote:
  enabled: false
  port: 9010
  rmiPort: 9010
  localOnly: false
  authenticate: false
  ssl: false
  rmiHostname: localhost

# The registry URL and credentials are provided by thatDot with your license key
image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

# Registry credentials provided by thatDot
imagePullSecrets: []

service:
  name: novelty
  type: ClusterIP
  externalPort: 8080
  internalPort: 8080

resources:
  limits:
    cpu: 2048m
    memory: 4096Mi
  requests:
    cpu: 1024m
    memory: 2048Mi

# OIDC Configuration for OpenID Connect authentication
oidc:
  # Enable OpenID Connect authentication
  enabled: false
  provider:
    # OIDC provider base URL
    locationUrl: ""
    # OAuth2 authorization endpoint for login requests
    authorizationUrl: ""
    # OAuth2 token endpoint for exchanging auth codes
    tokenUrl: ""
    # OIDC provider's login endpoint path (appended to locationUrl for user redirect)
    loginPath: ""
  client:
    existingSecret:
      # Kubernetes secret containing OIDC client credentials
      name: ""
      secretKeys:
        # Secret key name containing the OIDC client ID
        clientIdKey: "client-id"
        # Secret key name containing the OIDC client secret
        clientSecretKey: "client-secret"
  session:
    # Auto-generate session encryption key if no existing secret provided
    autoGenerate: true
    existingSecret:
      # Kubernetes secret containing session encryption key (if not auto-generating)
      name: ""
      # Secret key name containing the session encryption key
      key: ""
    # Session timeout
    expirationSeconds: 3600
    # Use HTTPS-only secure cookies for session handling
    secureCookies: true

# Logging Configuration
thatdot:
  # Cluster-wide log level (ERROR, WARN, INFO, DEBUG)
  logLevel: WARN

webserver:
  enabled: true
  address: 0.0.0.0
  port: 8080
  useTls: false
  useMTls:
    enabled: false
    healthEndpoints:
      enabled: false
      port: 8081
    # trustStore:
    #   path: ""
    #   password: ""

webserverAdvertise:
  enabled: false
  address:
  port:

# mTLS Configuration
# When webserver.useMTls.enabled is true:
# - If healthEndpoints.enabled is true, health probes will use HTTP on the loopback
#   address with the configured healthEndpoints.port
# - If healthEndpoints.enabled is false, health probes will be disabled

# Whitespace-separated jdk arguments injected via JAVA_JDK_OPTIONS
extraJdkArgs: ""

# Use these values to attach mount volumes to the Novelty container
volumes: []
volumeMounts: []

# ============================================================================
# Bundled Subchart Defaults (eval/dev only)
# These values configure the optional bundled Keycloak subchart.
# They only take effect when keycloak.bundled is true.
# For production, use an external Keycloak or OIDC provider instead.
# ============================================================================

# Bundled Keycloak + PostgreSQL configuration (subchart: keycloak)
