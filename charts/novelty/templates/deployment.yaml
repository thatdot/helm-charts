apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novelty.fullname" . }}
  labels:
    {{- include "novelty.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "novelty.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "novelty.prometheusAnnotations" . | nindent 8 }}
      labels:
        {{- include "novelty.labels" . | nindent 8 }}
    spec:
      {{- if and .Values.keycloak .Values.keycloak.bundled }}
      initContainers:
        {{- include "thatdot-common.waitForKeycloakInitContainer" (dict "root" . "realmName" "novelty") | nindent 8 }}
        {{- include "thatdot-common.truststoreInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: JDK_JAVA_OPTIONS
            value: |
              -Dconfig.override_with_env_vars=true
              {{ include "novelty.logLevelConfiguration" . | nindent 14 }}
              {{ include "novelty.oidcConfiguration" . | nindent 14 }}
              {{ include "novelty.metricsJdkOptions" . | nindent 14 }}
              {{ include "novelty.webserverConfiguration" . | nindent 14 }}
              {{ include "novelty.webserverAdvertiseConfiguration" . | nindent 14 }}
              {{ include "novelty.jmxJdkOptions" . | nindent 14 }}
              {{ include "novelty.prometheusJdkOptions" . | nindent 14 }}
              {{ include "thatdot-common.truststoreJdkArgs" . | nindent 14 }}
              {{ .Values.extraJdkArgs }}
          {{ include "thatdot-common.oidcEnvVars" (dict "root" . "envPrefix" "thatdot_novelty_auth" "fullname" (include "novelty.fullname" .)) | nindent 10 }}
          {{ include "novelty.licenseKeyValidation" . }}
          - name: CONFIG_FORCE_thatdot_novelty_license__key
            valueFrom:
              secretKeyRef:
                name: {{ .Values.licenseKeySecret.name }}
                key: {{ .Values.licenseKeySecret.key }}
          ports:
          - containerPort: {{ .Values.service.internalPort }}
          {{- if .Values.webserver.useMTls.enabled }}
          {{- if .Values.webserver.useMTls.healthEndpoints.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --silent -f -o /dev/null http://127.0.0.1:{{ .Values.webserver.useMTls.healthEndpoints.port }}/api/v2/admin/liveness
            initialDelaySeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --silent -f -o /dev/null http://127.0.0.1:{{ .Values.webserver.useMTls.healthEndpoints.port }}/api/v2/admin/liveness
            initialDelaySeconds: 5
          {{- end }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: /api/v2/admin/liveness
              port: 8080
              {{- if .Values.webserver.useTls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v2/admin/liveness
              port: 8080
              {{- if .Values.webserver.useTls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "thatdot-common.truststoreVolumeMounts" . | nindent 12 }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "thatdot-common.truststoreVolumes" . | nindent 8 }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
