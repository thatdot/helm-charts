{{- if and .Values.oidc.enabled .Values.oidc.session.autoGenerate }}
{{- $secretName := printf "%s-session-secret" (include "novelty.fullname" .) }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "novelty.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Keep the generated secret across upgrades; generate one when there is none yet */}}
  secret: {{ dig "data" "secret" (randAlphaNum 45 | b64enc) ($existingSecret | default dict) | quote }}
{{- end }}
