apiVersion: v2
name: quine-enterprise
description: A Helm chart for creating a thatDot Quine Enterprise cluster
type: application

version: 0.5.3

appVersion: "1.10.0"

dependencies:
  - name: thatdot-common
    version: "~0.1"
    repository: "file://../thatdot-common"
  - name: cassandra
    alias: cassandra-db
    version: "~11"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: cassandra.bundled
  - name: keycloak
    version: "~25"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: keycloak.bundled
